
name: provafinal

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: provafinal
      POSTGRES_USER: provafinal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provafinal -d provafinal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      DB_URL: jdbc:postgresql://db:5432/provafinal
      DB_USER: provafinal
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
