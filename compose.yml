
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: provafinal
      POSTGRES_USER: provafinal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Senha obrigatoria}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provafinal -d provafinal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://db:5432/provafinal
      DB_USERNAME: provafinal
      DB_PASSWORD: ${DB_PASSWORD:?Senha obrigatoria}

      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:?Issuer obrigatorio}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Audience obrigatoria}

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
